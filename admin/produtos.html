<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Produtos — Admin</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
    .product-row{display:flex;gap:1rem;padding:0.8rem;border:1px solid #eee;border-radius:12px;margin-bottom:0.6rem;align-items:center;background:#fff;transition:all .35s ease}
    .product-row:hover{box-shadow:0 14px 32px rgba(16,24,40,0.08);transform:translateY(-4px)}
    .product-row img{width:96px;height:64px;object-fit:cover;border-radius:8px}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:0.6rem 1rem;border-radius:10px;text-decoration:none;font-weight:700;border:none;cursor:pointer;transition:all .3s ease}
    .btn-ws{background:linear-gradient(135deg,#d62828,#ff4d4d);color:#fff;box-shadow:0 6px 18px rgba(214,40,40,0.25)}
    .btn-ws:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(214,40,40,0.35)}
    .btn-outline{border:1px solid #ddd;background:transparent;color:var(--dark)}
    .btn-outline:hover{background:#f5f5f5;transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,0.06)}
  </style>
</head>
<body>
  <div class="admin-wrap">
    <aside class="admin-sidebar">
      <div style="display:flex;align-items:center;gap:0.6rem;margin-bottom:1rem">
        <img src="../images/logo_clean_opt.png" width="44" height="44" alt="logo" style="border-radius:50%;object-fit:cover">
        <div><strong>CONSERTA <span style="color:var(--accent)">BARATO</span></strong><div class="small">Painel Administrativo</div></div>
      </div>
      <nav class="sidebar-menu">
        <a href="index.html">📊 Dashboard</a>
        <a href="produtos.html" class="active">📱 Produtos</a>
        <a href="servicos.html">🔧 Serviços</a>
        <a href="#" id="confLink2">⚙️ Configurações</a>
        <a href="#" id="logoutBtn2">🚪 Sair</a>
      </nav>
    </aside>
    <main class="admin-main">
      <div class="topbar">
        <h2>Produtos</h2>
        <div><button id="addProductBtn" class="btn btn-ws">+ ADICIONAR PRODUTO</button></div>
      </div>
      <div id="productsList"></div>

      <!-- Modal / Form -->
      <div id="productModal" class="modal" aria-hidden="true">
        <div class="modal-content">
          <button class="modal-close" id="closeModal">✕</button>
          <div style="padding:1rem;">
            <h3 id="modalTitle">Novo produto</h3>
            <form id="productForm">
              <label>Nome<input id="p_name" required></label>
              <label>Marca<input id="p_brand"></label>
              <label>Modelo<input id="p_model"></label>
              <label>Armazenamento<input id="p_storage"></label>
              <label>RAM<input id="p_ram"></label>
              <label>Cor<input id="p_color"></label>
              <label>Categoria<select id="p_category"><option value="novo">Novo</option><option value="seminovo">Seminovo</option></select></label>
              <label>Preço<input id="p_price"></label>
              <label>Preço promocional<input id="p_price_promo"></label>
              <label>Status<select id="p_status"><option value="available">Disponível</option><option value="vendido">Vendido</option><option value="indisponivel">Indisponível</option></select></label>
              <label>Descrição<textarea id="p_description"></textarea></label>
              <label>URL da imagem principal<input id="p_photo_url" placeholder="https://..."></label>
              <div style="margin-top:0.6rem"><button class="btn btn-ws" id="saveProductBtn">Salvar</button><button type="button" class="btn btn-outline" id="cancelProductBtn">Cancelar</button></div>
            </form>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
