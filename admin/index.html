<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — CONSERTA BARATO</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .admin-wrap{display:flex;min-height:100vh}
    .admin-sidebar{width:260px;border-right:1px solid #eee;padding:1rem;background:#fff;transition:all .35s ease}
    .admin-main{flex:1;padding:1.2rem}
    .sidebar-menu{display:flex;flex-direction:column;gap:0.4rem}
    .sidebar-menu a{padding:0.6rem;border-radius:8px;text-decoration:none;color:var(--dark);transition:all .3s ease}
    .sidebar-menu a:hover{background:rgba(214,40,40,0.06);color:var(--accent);transform:translateX(4px)}
    .sidebar-menu a.active{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(214,40,40,0.25)}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem}
    .small{font-size:0.85rem;color:var(--muted)}
    .page-header{background:rgba(255,255,255,0.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,0.06);position:sticky;top:0;z-index:1000;transition:background .35s ease, box-shadow .35s ease}
    .page-header.shrink{box-shadow:0 10px 30px rgba(0,0,0,0.08);background:rgba(255,255,255,0.92)}
    .header-inner{max-width:1100px;margin:0 auto;padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between}
    .logo{font-weight:800;color:var(--dark);text-decoration:none;font-size:1.25rem;display:flex;align-items:center;gap:0.6rem}
    .logo-img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:var(--accent);display:block}
    .logo-text{font-weight:800;color:var(--dark);font-size:1.05rem}
    .logo-text span{color:var(--accent)}
  </style>
</head>
<body>
  <div class="admin-wrap">
    <aside class="admin-sidebar">
      <div style="display:flex;align-items:center;gap:0.6rem;margin-bottom:1rem">
        <img src="../images/logo_clean_opt.png" width="44" height="44" alt="logo" style="border-radius:50%;object-fit:cover">
        <div><strong>CONSERTA <span style="color:var(--accent)">BARATO</span></strong><div class="small">Painel Administrativo</div></div>
      </div>
      <nav class="sidebar-menu">
        <a href="index.html" class="active">📊 Dashboard</a>
        <a href="produtos.html">📱 Produtos</a>
        <a href="servicos.html">🔧 Serviços</a>
        <a href="#" id="confLink">⚙️ Configurações</a>
        <a href="#" id="logoutBtn">🚪 Sair</a>
      </nav>
    </aside>
    <main class="admin-main">
      <h2>Dashboard</h2>
      <div id="stats" class="cards" style="margin-top:1rem"></div>
      <h3 style="margin-top:1.6rem">Últimos produtos cadastrados</h3>
      <div id="latest" style="margin-top:0.8rem"></div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
