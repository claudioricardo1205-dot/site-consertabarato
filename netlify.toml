[build]
  publish = "."
  command = ""

[context.production.environment]
  NODE_ENV = "production"

[headers]
  # cache static assets longer
  [[headers]]
  for = "/*.@(js|css|webp|png|jpg|jpeg|svg)"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

  [[headers]]
  for = "/index.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[redirects]
  # SPA fallback removido para evitar conflito com arquivos estáticos
